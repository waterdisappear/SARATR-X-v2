# MIM_finetune (HiViT 少样本微调) 配置
# MIM_finetune (HiViT few-shot fine-tuning) configuration

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 50
  TEST:
    BATCH_SIZE: 50
  NUM_WORKERS: 0

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.2109]   # SAR 强度图统计值 (SAR intensity statistics)
  PIXEL_STD: [0.2178]
  TRANSFORMS: ["normalize"]

OPTIM:
  NAME: "adamw"
  LR: 1e-3
  MAX_EPOCH: 50
  WEIGHT_DECAY: 1e-4
  ADAM_BETA1: 0.9
  ADAM_BETA2: 0.95
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 20
